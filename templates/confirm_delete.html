{% extends "base.html" %}
{% block content %}
  <section class="confirmation-card">
    <p class="tag">Confirmation required</p>
    <h1>Delete {{ object }}?</h1>
    <p>This action cannot be undone.</p>
    <form class="actions" method="post">
      {% csrf_token %}
      <button class="danger" type="submit">Yes, delete</button>
      <a class="cancel" href="javascript:history.back()">No, keep it</a>
    </form>
  </section>
{% endblock %}
